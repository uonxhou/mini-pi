name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # 允许手动触发（用于测试或补发）

jobs:
  # Gate: the full test matrix must pass before anything reaches PyPI.
  # A PyPI version number can never be reused, so a bad publish is permanent —
  # worth blocking on. Reuses test.yml so the gate cannot drift from CI.
  test:
    uses: ./.github/workflows/test.yml

  publish:
    name: Build & publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI OIDC 可信发布
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing automatic
