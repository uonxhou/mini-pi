name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets publish.yml reuse this exact matrix instead of duplicating it —
  # the tests gating a release must be the same ones that run on main.
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Never cancel siblings on first failure: platform-specific breakage is
      # exactly what this matrix exists to find, and cancelling would hide
      # whether a failure is universal or confined to one OS.
      fail-fast: false
      matrix:
        # Every OS at both ends of the supported range: mini-pi once shipped a
        # release that could not start on Windows at all, so platform coverage
        # is the priority.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
        # Fill in the middle on Linux only. Cheap (~15s each) and it keeps the
        # Python classifiers in pyproject.toml honest — every version claimed
        # there is a version actually exercised here.
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v7
        with:
          # setup-uv includes this value in its cache key. Without it, matrix
          # jobs on the same OS race to save one shared cache at teardown.
          python-version: ${{ matrix.python }}

      - name: Run tests
        run: uv run --group dev pytest
